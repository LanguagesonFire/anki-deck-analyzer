[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-deck-analyzer"
version = "1.9.1"
description = "Score an Anki language deck against nine published quality criteria."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Languages on Fire" }]
keywords = ["anki", "flashcards", "language-learning", "apkg", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "anthropic>=0.97",
    "zstandard>=0.21",
    # One neutral frequency list per language, the same for every deck. A
    # core dependency, not an extra, so two installs score vocabulary alike.
    "wordfreq>=3.1",
]

[project.optional-dependencies]
# Count new words by dictionary form instead of spelling. Without it the tool
# counts each inflected form separately and says so in the report.
lemma = [
    # Capped below 2.0: 2.0 lemmatizes Arabic and may shift counts elsewhere,
    # and every report so far was measured on 1.x.
    "simplemma>=1.1,<2",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-uk",
]
# Korean: split text into morphemes the way wordfreq's Korean list is, so the
# deck can be compared with it. Has wheels for Windows, macOS and Linux.
korean = ["kiwipiepy>=0.17"]
# Chinese and Japanese: split text into words for the frequency comparison.
# Without them those decks get no frequency table. Janome is pure Python and
# reads the IPA dictionary wordfreq's Japanese list was built with.
chinese = ["jieba>=0.42"]
japanese = ["janome>=0.5"]

[project.urls]
Homepage = "https://languages-on-fire.com"

[project.scripts]
anki-deck-analyzer = "anki_deck_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_deck_analyzer"]
